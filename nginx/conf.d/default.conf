resolver 127.0.0.11 valid=30s;

# Upstream 설정
upstream frontend {
    server frontend:5173 resolve;
}

upstream backend {
    server backend:8080 resolve;
}

upstream ai {
    server ai:8000 resolve;
}

upstream socket-server {
    server backend:9090 resolve;
}

upstream jenkins {
    server jenkins:8443 resolve;
}

# HTTP to HTTPS redirect
server {
    listen 80;
    server_name j12b102.p.ssafy.io;
    return 301 https://$server_name$request_uri;
}

# Main server configuration
server {
    listen 443 ssl;
    server_name j12b102.p.ssafy.io;

    # SSL 설정
    ssl_certificate /etc/letsencrypt/live/j12b102.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j12b102.p.ssafy.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 공통 프록시 설정
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # 공통 에러 처리
    proxy_intercept_errors on;
    error_page 502 503 504 = @maintenance;

    # Frontend
    location / {
        proxy_pass http://frontend/;
    }

    # Backend API
    location /api/v1/ {
        proxy_pass http://backend/api/v1/;
    }

    # AI API
    location /api/ai/ {
        proxy_pass http://ai/api/ai/;
    }

    # WebSocket endpoint
    location /socket.io/ {
        proxy_pass http://socket-server/socket.io/;
        
        # WebSocket 필수 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # WebSocket 최적화
        proxy_buffering off;
        proxy_read_timeout 600s;
    }

    # Jenkins
    location /jenkins {
        proxy_pass http://jenkins;
        proxy_read_timeout 90s;
        
        # Jenkins 필수 설정
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_redirect http:// https://;
    }

    # Maintenance page
    location @maintenance {
        root /usr/share/nginx/html;
        try_files /maintenance.html =503;
    }
}