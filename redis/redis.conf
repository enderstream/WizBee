# Network
bind 0.0.0.0
port 16379
protected-mode no
tcp-keepalive 60

# General
daemonize no
pidfile /var/run/redis/redis-server.pid

# Memory Management
maxmemory 256mb
maxmemory-policy allkeys-lru

# Snapshotting
save 900 1
save 300 10
save 60 10000
dir /data

# Performance Tuning
io-threads 4
io-threads-do-reads yes

# Connection Pool
maxclients 10000