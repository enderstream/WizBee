sonarqube-check:
  tags:
    - sonarqube
  image: gradle:8.12.1-jdk17
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: "${CI_JOB_NAME}"
    paths:
      - .sonar/cache
      - .gradle
  script: 
    - gradle build -x test
    - gradle sonarqube -Dsonar.projectKey=Wizbee_key -Dsonar.qualitygate.wait=true
  allow_failure: true
  only:
    - release