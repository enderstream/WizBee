services:
  jenkins:
    build: ./jenkins
    container_name: jenkins
    expose:
      - "18443"
    volumes:
      - ./jenkins/jenkins_home:/var/jenkins_home:rw # << ./ 해주면 현재 디렉토리에 jenkins_home을 생성함
      - /usr/local/bin/docker-compose:/usr/local/bin/docker-compose
    networks:
      - wizbee
    restart: unless-stopped
    environment:
      TZ: Asia/Seoul
      JENKINS_OPTS: "--httpPort=18443 --prefix=/jenkins"

networks:
  wizbee:
    external: true
